/** Applying this file in a Forge build will imbue it with the powers of Mixin. */

repositories {
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/maven/'
    }
}

dependencies {
    // Compile-only: at runtime UniMixins (provided by the launcher in
    // experimental mode, or embedded sponge Mixin on the classic path)
    // hosts our mixin configs. Never embed Mixin here — duplicate Mixin
    // jars on the classpath break both hosts.
    compileOnly('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        setTransitive false
    }
}

ext.outRefMapFile = "${tasks.compileJava.temporaryDir}/${project.modid}.mixin.refmap.json"

jar {
    manifest {
        attributes (
            // Main config (required, vanilla-safe) + experimental configs
            // (optional: only apply when their targets exist — keeps the
            // classic Java 8 path green without PalaMod/Zephyr/OptiFine).
            'MixinConfigs': "${project.modid}.mixin.json,${project.modid}-lwjgl3.json,${project.modid}-paladium.json,${project.modid}-zephyr.json",
            // TweakClass marks this jar as a Mixin container so the platform
            // agent picks up MixinConfigs (without it no
            // "Selecting anarchycompat-*.json" ever appears — every working
            // mod in the pack declares this same tweaker). Safe: identical
            // string already declared by UniMixins/fspatches/PalaMod/etc.,
            // Launch instantiates the tweaker once by class name, and this
            // jar ships zero org/spongepowered classes so it cannot win or
            // corrupt the Mixin service race — UniMixins still hosts Mixin.
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'TweakOrder': 0,

            // If these two are not set, Forge will not detect the mod, it will only run the mixins
            'FMLCorePluginContainsFMLMod': 'true',
            'ForceLoadAsMod': 'true',
        )
    }

    from outRefMapFile;
}

def outSrgFile = "${tasks.compileJava.temporaryDir}/outSrg.srg"

afterEvaluate {
    tasks.compileJava.options.compilerArgs += ["-AreobfSrgFile=${tasks.reobf.srg}", "-AoutSrgFile=${outSrgFile}", "-AoutRefMapFile=${outRefMapFile}"];
}

reobf {
    addExtraSrgFile outSrgFile
}
