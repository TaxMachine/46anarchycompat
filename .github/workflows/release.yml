# Release build: publishing a GitHub release runs the full
# ForgeGradle build and attaches the jar to that release.
# The 46Anarchy launcher pins per-release asset URLs, so each release
# must produce `anarchycompat-<version>.jar` (version = tag without `v`).
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 4.6 + ForgeGradle 1.2.11 run on Java 8. Unlike Computium,
      # this shim references no Java 17+ classes (OptiFine + Mixin API
      # only), so no Java 21 fork is needed.
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      # Compile-only deps (gitignored by design — see mods/README.md and
      # libs/README.md). The three Paladium jars are NOT optional: the Mixin
      # AP resolves every @Mixin target at compile time (mixin/paladium +
      # mixin/zephyr reference these classes).
      - name: Fetch compile-only deps
        run: |
          mkdir -p mods libs
          curl -fsSL -o mods/unimixins-all.jar \
            "https://github.com/LegacyModdingMC/UniMixins/releases/download/0.3.2/%2Bunimixins-all-1.7.10-0.3.2.jar"
          for jar in optifine-prod.jar PalaMod-9.5.0.jar PalaVoiceChat-1.1.0.jar Zephyr-UI-8.5.0.jar; do
            curl -fsSL -o "mods/$jar" "https://cdn.46anarchy.fr/files/mods/$jar"
          done
          # RFB plugin API (compileOnly, api package only) — extracted from
          # the same lwjgl3ify forgePatches artifact the launcher serves.
          curl -fsSL -o /tmp/lwjgl3ify-forgePatches.jar \
            "https://nexus.gtnewhorizons.com/repository/public/com/github/GTNewHorizons/lwjgl3ify/3.0.38/lwjgl3ify-3.0.38-forgePatches.jar"
          mkdir -p /tmp/rfb-api
          unzip -q /tmp/lwjgl3ify-forgePatches.jar 'com/gtnewhorizons/retrofuturabootstrap/api/*' -d /tmp/rfb-api
          (cd /tmp/rfb-api && "$JAVA_HOME/bin/jar" cf "$GITHUB_WORKSPACE/libs/rfb-api.jar" .)
          ls -la mods/ libs/

      # Deobfuscated Forge workspace (first run downloads MCP mappings
      # and decompiles — ~10 min, cached per workflow run after that).
      - name: Setup ForgeGradle workspace
        run: ./gradlew setupDecompWorkspace --console=plain

      - name: Build
        run: ./gradlew build --console=plain

      # Attach versioned jar to the release that triggered this run.
      - name: Upload release asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/libs/anarchycompat.jar "anarchycompat-${VERSION}.jar"
          sha256sum "anarchycompat-${VERSION}.jar"
          gh release upload "$GITHUB_REF_NAME" "anarchycompat-${VERSION}.jar" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
