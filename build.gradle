buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            url = "https://jitpack.io"
        }
    }
    dependencies {
        classpath('com.github.GTNewHorizons:ForgeGradle:1.2.11') {
            exclude group: "org.eclipse.equinox"
        }
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

configurations {
    shade
}

jar {
    archiveName = "anarchycompat.jar"
}

dependencies {
    // RFB plugin API, extracted from lwjgl3ify's forgePatches jar (api
    // package only). The RFB plugin widens MixinTransformer so PalaMod's
    // merged Loader handler checkcast survives RFB's dual-loader split.
    // Compile-only: RFB itself provides these classes at runtime.
    compileOnly files('libs/rfb-api.jar')
}

apply from: "buildscript/forge-1.7.gradle"
